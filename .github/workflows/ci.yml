name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio ruff mypy types-PyYAML httpx2
          python -m pip install -e .

      - name: Tests
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q --tb=short -rfE 2>&1 | tee tests-output.txt
          code=${PIPESTATUS[0]}
          echo "pytest exit code: $code"
          exit $code
        env:
          STRICT_KPI: "1"

      - name: Lint
        run: python -m ruff check astra/ tests/ dashboard_app.py

      - name: Types
        run: python -m mypy astra/ dashboard_app.py --python-version ${{ matrix.python-version }}

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install wheel outside the source tree
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")

          with tempfile.TemporaryDirectory() as temporary:
              target = pathlib.Path(temporary) / "site"
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--no-deps",
                   "--target", str(target), str(wheels[0])],
                  check=True,
              )
              required_assets = [
                  "dashboard_real.html",
                  "favicon.ico",
                  "manifest.webmanifest",
                  "static",
              ]
              missing = [
                  name for name in required_assets
                  if not (target / name).exists()
              ]
              if missing:
                  raise SystemExit(f"wheel is missing runtime assets: {missing}")

              env = os.environ.copy()
              env["PYTHONPATH"] = str(target)
              subprocess.run(
                  [sys.executable, "-c",
                   "import astra; from astra.cli import console_main; import dashboard_app"],
                  cwd=temporary,
                  env=env,
                  check=True,
              )
          PY

      - name: Coverage diagnostic
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          STRICT_KPI: "1"
        run: python coverage.py

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-report
          path: coverage-report.json
          if-no-files-found: ignore

      - name: Keep test output on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-failure-${{ matrix.os }}-py${{ matrix.python-version }}
          path: tests-output.txt
          if-no-files-found: ignore

  security:
    name: dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Audit pinned runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build image
        run: docker build --tag astracore:ci .
      - name: Smoke test image
        run: docker run --rm --entrypoint python astracore:ci -c "import astra; import dashboard_app"

  codeql:
    name: CodeQL security analysis
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea

  ci-gate:
    name: CI required gate
    if: always()
    needs: [test, security, docker, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          echo "test=$TEST_RESULT security=$SECURITY_RESULT docker=$DOCKER_RESULT codeql=$CODEQL_RESULT"
          test "$TEST_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          test "$DOCKER_RESULT" = "success"
          test "$CODEQL_RESULT" = "success" || test "$CODEQL_RESULT" = "skipped"
